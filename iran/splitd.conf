# splitd v3 settings -- Iran side
# V3 requires two distinct flow ports to keep application payload one-way per TCP flow.
# This default local port allows a side-by-side trial next to the V2 panel outbound.
LOCAL_ADDR=127.0.0.1:93
DL_PORT=12797
UL_PORT=12798

# Replace a flow only when its oldest application frame has stayed unacknowledged
# this long. This is a health threshold, not a periodic restart interval.
FLOW_STALE_SEC=15
